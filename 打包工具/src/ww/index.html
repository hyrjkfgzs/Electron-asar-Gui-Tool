<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Electron asar Gui工具</title>
    <style>
      /* 基础变量 */
      :root {
        --animal-primary-color: #19c8b9;
        --animal-primary-color-hover: #16b3a5;
        --animal-primary-color-active: #14a093;
        --animal-primary-color-bg: rgba(25, 200, 185, 0.08);
        
        --animal-success-color: #52c41a;
        --animal-success-color-hover: #73d13d;
        --animal-success-color-active: #389e0d;
        
        --animal-warning-color: #faad14;
        --animal-warning-color-hover: #ffc53d;
        --animal-warning-color-active: #d48806;
        
        --animal-error-color: #ff4d4f;
        --animal-error-color-hover: #ff7875;
        --animal-error-color-active: #cf1322;
        
        --animal-text-color: #594b3b;
        --animal-text-color-secondary: #7a6a56;
        --animal-text-color-disabled: #c4b89e;
        
        --animal-border-color: #d4c9b4;
        --animal-border-color-hover: #c4b89e;
        --animal-border-color-light: #e8e0d3;
        
        --animal-bg-color: #fffdf6;
        --animal-bg-color-secondary: #f8f4e9;
        --animal-bg-color-disabled: #f0e8d8;
        
        --animal-font-family: 'Nunito', 'Noto Sans SC', 'Zen Maru Gothic', sans-serif;
        --animal-font-size-sm: 14px;
        --animal-font-size-base: 16px;
        --animal-font-size-lg: 18px;
        --animal-line-height-base: 1.5;
        
        --animal-spacing-xs: 4px;
        --animal-spacing-sm: 8px;
        --animal-spacing-md: 16px;
        --animal-spacing-lg: 20px;
        --animal-spacing-xl: 24px;
        
        --animal-border-radius-sm: 20px;
        --animal-border-radius-base: 50px;
        --animal-border-radius-lg: 60px;
        --animal-border-width: 2.5px;
        
        --animal-shadow-sm: 0 2px 0 0 #d4c9b4;
        --animal-shadow-base: 0 3px 0 0 #d4c9b4;
        --animal-shadow-lg: 0 5px 0 0 #bdaea0;
        
        --animal-motion-duration-fast: 0.15s;
        --animal-motion-duration-base: 0.3s;
        --animal-motion-duration-slow: 0.5s;
        --animal-motion-ease: cubic-bezier(0.23, 1, 0.32, 1);
        
        --animal-height-sm: 36px;
        --animal-height-base: 44px;
        --animal-height-lg: 52px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: transparent;
        padding: 0 0 8px 0;
        margin: 0;
        min-height: 100vh;
        font-family: var(--animal-font-family);
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        height: calc(100vh - 8px);
        background: var(--animal-bg-color);
        border: 4px solid #7a6a56;
        border-radius: 24px;
        box-shadow: 0 8px 0 0 #5a4a36;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* 标题栏 */
      .title-bar {
        background: linear-gradient(180deg, #52d4c8 0%, #3fc6b8 100%);
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 4px solid #2b9b8f;
        -webkit-app-region: drag;
        app-region: drag;
      }

      .title-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .title-left h1 {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 0 rgba(0,0,0,0.2);
        letter-spacing: 0.05em;
      }

      .window-controls {
        display: flex;
        gap: 8px;
      }

      .window-btn {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0,0,0,0.2);
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        transition: all var(--animal-motion-duration-fast);
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }

      .window-btn:hover:not(:disabled) {
        transform: scale(1.1);
      }

      .window-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .window-btn-min {
        background: #ffda5e;
        color: #b38f00;
      }

      .window-btn-max {
        background: #76e68d;
        color: #2d8b3f;
      }

      .window-btn-close {
        background: #ff7a7a;
        color: #b32d2d;
      }

      /* 内容区域 */
      .content-area {
        padding: 20px;
        background: linear-gradient(180deg, #fffdf6 0%, #f8f4e9 100%);
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* 选项卡 */
      .tabs {
        background: var(--animal-bg-color);
        border-radius: 16px;
        border: 2.5px solid var(--animal-border-color-light);
        overflow: hidden;
        margin-bottom: 20px;
        flex-shrink: 0;
      }

      .tab-list {
        display: flex;
        gap: 4px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.6);
        border-bottom: 2px solid var(--animal-border-color-light);
      }

      .tab-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 16px;
        background: transparent;
        border: none;
        border-radius: 60px;
        cursor: pointer;
        font-family: var(--animal-font-family);
        font-size: 15px;
        font-weight: 500;
        color: var(--animal-text-color);
        transition: all var(--animal-motion-duration-base) var(--animal-motion-ease);
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .tab-item:hover {
        background: rgba(25, 200, 185, 0.1);
      }

      .tab-item.active {
        background: #0CC0B5;
        color: #FFF9E3;
        font-weight: 600;
        box-shadow: 0 3px 0 0 #bdaea0;
      }

      .tab-icon {
        font-size: 10px;
        color: #7a6a56;
        transition: transform var(--animal-motion-duration-base) var(--animal-motion-ease);
      }

      .tab-item.active .tab-icon {
        transform: scale(1.2);
        color: #794F27;
      }

      .tab-leaf {
        position: absolute;
        right: -5px;
        top: -4px;
        width: 18px;
        height: 18px;
        animation: leafWiggle 2s ease-in-out infinite;
      }

      .tab-panel {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
        padding: 8px 16px 0;
        animation: fadeIn 0.25s ease;
      }

      .tab-panel.active {
        display: flex;
      }

      @keyframes leafWiggle {
        0%, 100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-10deg);
        }
        75% {
          transform: rotate(10deg);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-section {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        margin-bottom: 24px;
        flex-shrink: 0;
      }

      .form-inputs {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .form-row label {
        width: 110px;
        font-size: 15px;
        font-weight: 600;
        color: var(--animal-text-color);
        text-align: right;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .input-wrapper {
        flex: 1;
        display: inline-flex;
        align-items: center;
        background: rgb(247, 243, 223);
        border: 2.5px solid #c4b89e;
        border-radius: 50px;
        height: 44px;
        padding: 0 18px;
        font-size: 16px;
        box-shadow: 0 3px 0 0 #d4c9b4;
        transition: all var(--animal-motion-duration-base) var(--animal-motion-ease);
      }

      .input-wrapper:hover {
        border-color: #a89878;
        box-shadow: 0 3px 0 0 #c4b89e;
      }

      .input-wrapper input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: #725d42;
        font-size: 16px;
        font-family: var(--animal-font-family);
        font-weight: 500;
      }

      .input-wrapper input::placeholder {
        color: #c4b89e;
        font-weight: 400;
      }

      .browse-btn {
        width: 44px;
        height: 44px;
        background: linear-gradient(180deg, #ffda5e 0%, #ffcf35 100%);
        border: 3px solid #e6b82e;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        font-weight: 700;
        color: #997a1a;
        box-shadow: 0 4px 0 0 #cc9f1f;
        transition: all var(--animal-motion-duration-fast);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .browse-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 0 0 #cc9f1f;
      }

      .browse-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 0 #cc9f1f;
      }

      /* 打包按钮 */
      .pack-btn {
        width: 80px;
        height: 104px;
        background: linear-gradient(180deg, #f8f8f0 0%, #f0e8d8 100%);
        border: 3px solid #bdaea0;
        border-radius: 20px;
        cursor: pointer;
        font-size: 18px;
        font-weight: 700;
        color: #794f27;
        box-shadow: 0 5px 0 0 #bdaea0;
        transition: all var(--animal-motion-duration-fast);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-family: var(--animal-font-family);
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .pack-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 0 0 #bdaea0;
      }

      .pack-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #bdaea0;
      }

      .pack-btn .icon {
        font-size: 28px;
      }

      /* 解包按钮 */
      .unpack-btn {
        width: 80px;
        height: 104px;
        background: linear-gradient(180deg, #fff5e6 0%, #ffe8c8 100%);
        border: 3px solid #e8b88a;
        border-radius: 20px;
        cursor: pointer;
        font-size: 18px;
        font-weight: 700;
        color: #b35a1a;
        box-shadow: 0 5px 0 0 #d4a070;
        transition: all var(--animal-motion-duration-fast);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-family: var(--animal-font-family);
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .unpack-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 0 0 #d4a070;
      }

      .unpack-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #d4a070;
      }

      .unpack-btn .icon {
        font-size: 28px;
      }

      /* 日志区域 */
      .log-area {
        background: linear-gradient(180deg, rgba(255,253,246,0.7) 0%, rgba(248,244,233,0.7) 100%);
        border: 3px solid #c4b89e;
        border-radius: 16px;
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.1);
        min-height: 0;
        margin-bottom: 0;
        position: relative;
        z-index: 10;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .log-area::-webkit-scrollbar {
        display: none;
      }

      /* 状态栏 */
      .status-bar {
        background: linear-gradient(180deg, #f0e8d8 0%, #e8dcc8 100%);
        padding: 0 20px;
        font-size: 13px;
        color: var(--animal-text-color-secondary);
        border-top: 3px solid #c4b89e;
        flex-shrink: 0;
        white-space: pre-wrap;
        height: 36px;
        line-height: 33px;
        overflow: hidden;
        display: flex;
        align-items: center;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      
      .status-left {
        flex: 1;
        text-align: left;
      }
      
      .status-right {
        flex-shrink: 0;
        text-align: right;
        font-weight: 600;
        color: #594b3b;
      }
      
      .status-right a {
        text-decoration: none;
        font-weight: 700;
      }
      
      .status-right a.link-volcano {
        color: #ff6b35;
      }
      
      .status-right a.link-jade {
        color: #19c8b9;
      }
      
      .status-right a:hover {
        text-decoration: underline;
      }

      /* Footer */
      .app-footer {
        width: 100%;
        height: 80px;
        background: url('footer-tree.webp') center / cover no-repeat;
        flex-shrink: 0;
        position: absolute;
        bottom: 6px;
        left: 0;
        right: 0;
      }

      

      .log-item {
        padding: 6px 10px;
        font-size: 14px;
        color: var(--animal-text-color-secondary);
        border-radius: 8px;
        margin-bottom: 4px;
        font-family: 'Noto Sans SC', sans-serif;
        transition: background var(--animal-motion-duration-fast);
        white-space: pre-wrap;
      }

      .log-item:hover {
        background: rgba(25, 200, 185, 0.08);
      }

      .log-item.info {
        color: var(--animal-text-color);
      }

      .log-item.success {
        color: var(--animal-success-color);
      }

      .log-item.error {
        color: var(--animal-error-color);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title-bar">
        <div class="title-left">
          <h1>Electron asar Gui工具</h1>
        </div>
        <div class="window-controls">
          <button class="window-btn window-btn-min" title="最小化" onclick="onWindowControl(1)">−</button>
          <button class="window-btn window-btn-max" title="最大化" disabled onclick="onWindowControl(2)">□</button>
          <button class="window-btn window-btn-close" title="关闭" onclick="onWindowControl(0)">×</button>
        </div>
      </div>
      <div class="content-area">
        <div class="tabs">
          <div class="tab-list">
            <button class="tab-item active" id="tabPack">
              <span class="tab-icon">●</span>
              <span>打包</span>
              <img src="icon-leaf.png" alt="" class="tab-leaf" />
            </button>
            <button class="tab-item" id="tabUnpack">
              <span class="tab-icon">○</span>
              <span>解包</span>
            </button>
          </div>
          
          <div class="tab-panel active" id="panelPack">
            <div class="form-section">
              <div class="form-inputs">
                <div class="form-row">
                  <label>打包文件夹：</label>
                  <div class="input-wrapper">
                    <input type="text" id="packFolderPath" placeholder="请选择要打包的文件夹..." jade-allow-contextmenu />
                  </div>
                  <button class="browse-btn" id="selectPackFolderBtn">...</button>
                </div>
                <div class="form-row">
                  <label>保存路径：</label>
                  <div class="input-wrapper">
                    <input type="text" id="packSavePath" placeholder="请选择保存路径..." jade-allow-contextmenu />
                  </div>
                  <button class="browse-btn" id="selectPackSaveBtn">...</button>
                </div>
              </div>
              <button class="pack-btn" id="packBtn">
                <span class="icon">📦</span>
                <span>打包</span>
              </button>
            </div>
          </div>
          
          <div class="tab-panel" id="panelUnpack">
            <div class="form-section">
              <div class="form-inputs">
                <div class="form-row">
                  <label>asar文件：</label>
                  <div class="input-wrapper">
                    <input type="text" id="unpackFilePath" placeholder="请选择要解包的文件..." jade-allow-contextmenu />
                  </div>
                  <button class="browse-btn" id="selectUnpackFileBtn">...</button>
                </div>
                <div class="form-row">
                  <label>保存路径：</label>
                  <div class="input-wrapper">
                    <input type="text" id="unpackSavePath" placeholder="请选择解包保存路径..." jade-allow-contextmenu />
                  </div>
                  <button class="browse-btn" id="selectUnpackSaveBtn">...</button>
                </div>
              </div>
              <button class="unpack-btn" id="unpackBtn">
                <span class="icon">📂</span>
                <span>解包</span>
              </button>
            </div>
          </div>
        </div>
        
        <div class="log-area" id="logArea"></div>
        <div class="app-footer"></div>
      </div>
      <div class="status-bar">
        <div class="status-left" id="statusLeft">就绪</div>
        <div class="status-right" id="statusRight">本软件使用 <a href="https://www.voldp.com/" target="_blank" class="link-volcano">火山视窗</a> + <a href="https://jade.run/" target="_blank" class="link-jade">JadeView</a> 开发</div>
      </div>
    </div>

    <script>
      // 禁用右键菜单，但允许在路径输入框上使用
      document.addEventListener('contextmenu', function(e) {
        const isPathInput = ['packFolderPath', 'packSavePath', 'unpackFilePath', 'unpackSavePath'].includes(e.target.id);
        if (!isPathInput) {
          e.preventDefault();
        }
      });

      // 禁用F5刷新
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || (e.keyCode === 116)) {
          e.preventDefault();
        }
      });
      
      const tabPack = document.getElementById('tabPack');
      const tabUnpack = document.getElementById('tabUnpack');
      const panelPack = document.getElementById('panelPack');
      const panelUnpack = document.getElementById('panelUnpack');
      
      const selectPackFolderBtn = document.getElementById('selectPackFolderBtn');
      const selectPackSaveBtn = document.getElementById('selectPackSaveBtn');
      const selectUnpackFileBtn = document.getElementById('selectUnpackFileBtn');
      const selectUnpackSaveBtn = document.getElementById('selectUnpackSaveBtn');
      
      const packBtn = document.getElementById('packBtn');
      const unpackBtn = document.getElementById('unpackBtn');
      const logArea = document.getElementById('logArea');
      
      const packFolderPathInput = document.getElementById('packFolderPath');
      const packSavePathInput = document.getElementById('packSavePath');
      const unpackFilePathInput = document.getElementById('unpackFilePath');
      const unpackSavePathInput = document.getElementById('unpackSavePath');
      
      const statusLeft = document.getElementById('statusLeft');
      const statusRight = document.getElementById('statusRight');

      function addLog(text, type = '') {
        const logItem = document.createElement('div');
        logItem.className = `log-item ${type}`;
        logItem.textContent = text;
        logArea.appendChild(logItem);
        logArea.scrollTop = logArea.scrollHeight;
      }

      function switchTab(tabName) {
        if (tabName === 'pack') {
          tabPack.classList.add('active');
          tabUnpack.classList.remove('active');
          panelPack.classList.add('active');
          panelUnpack.classList.remove('active');
          tabPack.querySelector('.tab-icon').textContent = '●';
          tabUnpack.querySelector('.tab-icon').textContent = '○';
          tabPack.querySelector('.tab-leaf').style.display = 'block';
          if (tabUnpack.querySelector('.tab-leaf')) {
            tabUnpack.querySelector('.tab-leaf').style.display = 'none';
          }
        } else {
          tabPack.classList.remove('active');
          tabUnpack.classList.add('active');
          panelPack.classList.remove('active');
          panelUnpack.classList.add('active');
          tabPack.querySelector('.tab-icon').textContent = '○';
          tabUnpack.querySelector('.tab-icon').textContent = '●';
          tabPack.querySelector('.tab-leaf').style.display = 'none';
          if (!tabUnpack.querySelector('.tab-leaf')) {
            const leafImg = document.createElement('img');
            leafImg.src = 'icon-leaf.png';
            leafImg.alt = '';
            leafImg.className = 'tab-leaf';
            tabUnpack.appendChild(leafImg);
          } else {
            tabUnpack.querySelector('.tab-leaf').style.display = 'block';
          }
        }
      }

      async function onWindowControl(type) {
        const result = await jade.invoke("Titleevent", { type: type });
      }

      tabPack.addEventListener('click', function() {
        switchTab('pack');
      });

      tabUnpack.addEventListener('click', function() {
        switchTab('unpack');
      });

      selectPackFolderBtn.addEventListener('click', async function() {
        try {
          await jade.invoke('selectFolder');
        } catch (error) {
          addLog('❌ 选择文件夹失败: ' + error.message, 'error');
        }
      });

      selectPackSaveBtn.addEventListener('click', async function() {
        try {
          await jade.invoke('selectSavePath');
        } catch (error) {
          addLog('❌ 选择保存路径失败: ' + error.message, 'error');
        }
      });

      selectUnpackFileBtn.addEventListener('click', async function() {
        try {
          await jade.invoke('selectAsarFile');
        } catch (error) {
          addLog('❌ 选择asar文件失败: ' + error.message, 'error');
        }
      });

      selectUnpackSaveBtn.addEventListener('click', async function() {
        try {
          await jade.invoke('selectUnpackSavePath');
        } catch (error) {
          addLog('❌ 选择解包保存路径失败: ' + error.message, 'error');
        }
      });

      packBtn.addEventListener('click', async function() {
        const folderPath = packFolderPathInput.value;
        const savePath = packSavePathInput.value;
        
        if (!folderPath || !savePath) {
          addLog('❌ 请先选择打包文件夹和保存路径', 'error');
          return;
        }
        
        this.style.transform = 'scale(0.95)';
        setTimeout(() => {
          this.style.transform = '';
        }, 150);
        
        try {
          await jade.invoke('pack', {
            folderPath: folderPath,
            savePath: savePath
          });
        } catch (error) {
          addLog('❌ 打包失败: ' + error.message, 'error');
        }
      });

      unpackBtn.addEventListener('click', async function() {
        const filePath = unpackFilePathInput.value;
        const savePath = unpackSavePathInput.value;
        
        if (!filePath || !savePath) {
          addLog('❌ 请先选择要解包的文件和保存路径', 'error');
          return;
        }
        
        this.style.transform = 'scale(0.95)';
        setTimeout(() => {
          this.style.transform = '';
        }, 150);
        
        try {
          await jade.invoke('unpack', {
            filePath: filePath,
            savePath: savePath
          });
        } catch (error) {
          addLog('❌ 解包失败: ' + error.message, 'error');
        }
      });

      jade.on('msg', function (payload) {
        if (statusLeft) {
          statusLeft.textContent = payload;
        }
      });

      jade.on('log', function (payload) {
        if (payload) {
          if (typeof payload === 'object' && payload.message) {
            addLog(payload.message, payload.type || '');
          } else {
            addLog(payload);
          }
        }
      });

      jade.on('selectFolder', function (payload) {
        if (payload) {
          packFolderPathInput.value = payload;
        }
      });

      jade.on('selectSavePath', function (payload) {
        if (payload) {
          packSavePathInput.value = payload;
        }
      });

      jade.on('selectAsarFile', function (payload) {
        if (payload) {
          unpackFilePathInput.value = payload;
        }
      });

      jade.on('selectUnpackSavePath', function (payload) {
        if (payload) {
          unpackSavePathInput.value = payload;
        }
      });
    </script>
  </body>
</html>
